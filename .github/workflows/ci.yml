name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check backend/app
      - run: ruff format --check backend/app
      # mypy runs non-blocking for now (|| true) -- the codebase hasn't had
      # a dedicated pass to satisfy `strict = true` (set in pyproject.toml)
      # everywhere yet; flipping this to blocking is a natural follow-up
      # once that pass happens, not something to fake as "already clean."
      - run: cd backend && mypy app || true

  backend-test-fast:
    # unit/agents/parsing tiers need no external services -- this is the
    # tier that should gate every PR quickly, before the slower
    # integration tier below even starts.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: cd backend && pip install -e ".[dev]"
      - run: cd backend && pytest -m "unit or agents or parsing" --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
        continue-on-error: true

  backend-test-integration:
    runs-on: ubuntu-latest
    needs: backend-test-fast
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: docmind
          POSTGRES_DB: docmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: cd backend && pip install -e ".[dev]"
      # GitHub Actions runners have Docker available natively, so
      # testcontainers works here even though it couldn't be exercised in
      # the sandbox this project was originally built in — see
      # tests/README.md for that context.
      - run: cd backend && pytest -m integration
        env:
          POSTGRES_HOST: localhost

  backend-api-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: cd backend && pip install -e ".[dev]"
      - run: cd backend && pytest -m api

  frontend-lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run typecheck

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test-fast, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: docmind-ai-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: docmind-ai-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
