[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-ai-backend"
version = "0.1.0"
description = "AI-enhanced documentation generator — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg2-binary>=2.9",
    "pydantic[email]>=2.9",
    "email-validator>=2.0",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.25",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "markdown>=3.7",
    "openai>=1.54",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
    "aioboto3>=13.2",
    "weasyprint>=63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "testcontainers[postgres]>=4.8",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["docker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure-logic tests, no I/O, no external services",
    "agents: agent tests using a fake LLM provider, no real API calls",
    "api: FastAPI route tests via dependency-override, no real DB",
    "integration: real DB/service tests, requires Postgres (see tests/integration/README.md)",
    "parsing: repository parsing tests (Tree-sitter/AST)",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
